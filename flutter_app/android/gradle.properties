org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# 网络较慢 / 走代理时放宽 HTTP 超时，避免依赖下载 "Read timed out"
systemProp.org.gradle.internal.http.connectionTimeout=300000
systemProp.org.gradle.internal.http.socketTimeout=300000
# 依赖下载失败时自动重试的次数
systemProp.org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.repository.initial.backoff=500

# pub 缓存位于 C: 盘、工程位于 D: 盘，Kotlin 增量编译的缓存校验会因
# "this and base files have different roots" 直接报错，故关闭增量编译
kotlin.incremental=false
kotlin.incremental.android=false
